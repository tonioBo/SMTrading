[project]
name = "smtrading"
version = "0.1.0"
description = "Simulated trading platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "redis>=5",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "websockets>=17.4",
    "yfinance>=1.8.0",
    "exchange-calendars>=4.13.2",
    "argon2-cffi>=25.1.0",
    "mcp>=2.3.0",
    "pyotp>=2.10.0",
    "fpdf2>=2.8",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "testcontainers[postgres,redis]",
    "httpx",
    "ruff",
    "respx>=0.23.1",
    "pypdf>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smtrading"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore:testcontainers.*is deprecated:DeprecationWarning",
    # exchange_calendars still calls pandas APIs deprecated in pandas 3.1.
    "ignore:.*returning an ndarray that drops timezone information.*:Warning",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

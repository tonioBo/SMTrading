# The «SMTrading TV» app entry (tv-app/, Tizen): plain http on the home network only,
# because a Tizen app refuses the local CA of the https entry and offers no way to accept
# it. It serves the TV screens' API only (/api/tv-display/*: read only, opened by the
# display token in the X-SMT-TV-Token header) and a health answer, nothing of the portal.
# The api sees `X-SMT-Entry: tv-app` (proxy-common.conf; every other entry overwrites a
# client-sent value with its own name), the only entry where the code poll returns the
# token in the body (to a request with `X-SMT-TV-App: 1`).

allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny all;

# the app's page is not on this origin (a packaged app): the API answers it by CORS,
# no credentials (the token travels in a header, never in a cookie or a URL)
set $smt_cors_headers "X-SMT-TV-Token, X-SMT-TV-App, Content-Type";

location /api/tv-display/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers $smt_cors_headers always;
        add_header Access-Control-Max-Age 600 always;
        add_header Cache-Control "no-store" always;
        return 204;
    }
    include /etc/nginx/smt/proxy-api.conf;
    add_header Access-Control-Allow-Origin "*" always;
}

location = /api/tv-display {
    include /etc/nginx/smt/security-headers.conf;
    return 404;
}

location = /tv-app/health {
    include /etc/nginx/smt/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 200 '{"ok":true,"service":"smtrading-tv-app"}';
}

location / {
    include /etc/nginx/smt/security-headers.conf;
    return 404;
}

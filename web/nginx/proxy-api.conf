include /etc/nginx/smt/proxy-common.conf;
proxy_hide_header Cache-Control;
include /etc/nginx/smt/security-headers.conf;
add_header Cache-Control "no-store" always;
# the build id of this bundle (see Dockerfile): the SPA compares it with its own
include /etc/nginx/smt/build-id.conf;
proxy_hide_header X-SMT-Build;
add_header X-SMT-Build $smt_build always;

# The api checks the WebSocket Origin against Host (with the port): forward the
# browser's Host unchanged ($http_host keeps ":3000", $host would drop it).
# a variable makes nginx resolve per request (see resolver in default.conf);
# with no URI part the original request URI is passed unchanged
set $smt_api_upstream http://api:8000;
proxy_pass $smt_api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# which entry the request came through (login failures are counted per entry)
proxy_set_header X-SMT-Entry $smt_entry;

# the local CA certificate, to install as a trusted root (README: "Accesso dalla rete locale")
alias /etc/nginx/certs/smtrading-ca.crt;
types { }
default_type application/x-x509-ca-cert;
include /etc/nginx/smt/security-headers.conf;
add_header Content-Disposition 'attachment; filename="smtrading-ca.crt"' always;
add_header Cache-Control "no-cache" always;

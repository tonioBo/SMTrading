# SMTrading web: SPA + proxy of /api/ and /ws to the api (Ruling R12).
#
#   :443  https, the LAN entry (certificate from 40-smtrading-tls.sh)
#   :80   redirects to https (the CA certificate is also served here, for first install)
#   :8080 plain http, the local entry only (compose publishes it on 127.0.0.1:3000) and e2e
#
# Every entry answers only the allowed hosts (smt/server_names.conf, generated from
# SMT_PUBLIC_HOSTS + localhost, 127.0.0.1, web); any other Host gets 444.

# login throttling per client address, on the LAN entry only (empty key = not counted)
map $smt_entry $smt_login_limit_key {
    lan     $binary_remote_addr;
    default "";
}
limit_req_zone $smt_login_limit_key zone=smt_login:10m rate=10r/m;

# HSTS only over https and never for localhost (browsers apply it to every port of
# localhost, which would break the plain http entry); an empty value is not sent
map "$scheme:$host" $smt_hsts {
    default                      "";
    "~^https:(localhost|127\.0\.0\.1|web)$" "";
    "~^https:"                   "max-age=31536000";
}

ssl_certificate     /etc/nginx/certs/smtrading.crt;
ssl_certificate_key /etc/nginx/certs/smtrading.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:smt_tls:10m;
ssl_session_timeout 1d;

# Re-resolve the api name through Docker's DNS: when the api container is recreated it
# gets a new IP, and a static proxy_pass would keep the old one (502 until restart).
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

# unknown SNI name over TLS: refuse the handshake, the real certificate is not presented.
# Exact names (the allowed hosts) win over this regex. Clients connecting by IP send no
# SNI: they reach the default_server below, which answers by Host (444 if not allowed).
server {
    listen 443 ssl;
    server_name ~^.+$;
    ssl_reject_handshake on;
}

# unknown Host: close without a response
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    listen 8080 default_server;
    http2 on;
    server_name _;
    set $smt_entry none;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    include /etc/nginx/smt/server_names.conf;
    set $smt_entry lan;
    include /etc/nginx/smt/app.conf;
}

server {
    listen 80;
    include /etc/nginx/smt/server_names.conf;
    set $smt_entry lan;

    location = /smtrading-ca.crt {
        include /etc/nginx/smt/ca-cert.conf;
    }

    location / {
        include /etc/nginx/smt/security-headers.conf;
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8080;
    include /etc/nginx/smt/server_names.conf;
    set $smt_entry local;
    include /etc/nginx/smt/app.conf;
}

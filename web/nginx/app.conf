# The application locations, shared by the https LAN entry and the local http entry.
# add_header is not inherited by a location that has its own: every location includes
# security-headers.conf.
root /usr/share/nginx/html;
index index.html;

location = /api/auth/login {
    limit_req zone=smt_login burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @smt_login_limited;
    include /etc/nginx/smt/proxy-api.conf;
}

location /api/ {
    include /etc/nginx/smt/proxy-api.conf;
}

location @smt_login_limited {
    include /etc/nginx/smt/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 429 '{"code":"RATE_LIMITED","message":"troppi tentativi di accesso, riprova più tardi","details":null}';
}

location = /ws {
    include /etc/nginx/smt/proxy-common.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    include /etc/nginx/smt/security-headers.conf;
}

location = /smtrading-ca.crt {
    include /etc/nginx/smt/ca-cert.conf;
}

# hashed build assets: cache forever
location /assets/ {
    include /etc/nginx/smt/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# SPA: unknown paths serve index.html (never cached, so new builds are picked up)
location / {
    include /etc/nginx/smt/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}

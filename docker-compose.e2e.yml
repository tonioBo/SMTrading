# Override for the isolated e2e stack (scripts/e2e.sh), used as
#   docker compose -p smtrading-e2e --env-file <tmp>/.env.e2e \
#     -f docker-compose.yml -f docker-compose.e2e.yml ...
# Own project, images, volumes (prefixed by the project name) and network; the only
# published port is the web local entry on 127.0.0.1:${SMT_E2E_WEB_PORT:-3190}. Nothing of the main
# `smtrading` stack is used or changed.
x-e2e-app: &e2e-app
  image: smtrading-e2e-backend:local
  env_file: !override
    - ${SMT_E2E_ENV_FILE:?generated by scripts/e2e.sh}

services:
  migrate:
    <<: *e2e-app
  api:
    <<: *e2e-app
    ports: !reset []
  worker:
    <<: *e2e-app
  web:
    image: smtrading-e2e-web:local
    environment:
      SMT_PUBLIC_HOSTS: e2e.invalid
    ports: !override
      - "127.0.0.1:${SMT_E2E_WEB_PORT:-3190}:8080"
  backup:
    profiles: ["disabled"]  # no daily dumps in the e2e stack

networks:
  smtrading-net:
    name: smtrading-e2e-net

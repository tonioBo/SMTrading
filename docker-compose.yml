name: smtrading

x-app: &app
  build:
    context: ./backend
    additional_contexts:
      agentdocs: ./docs/paperclip-agents  # «Istruzioni agenti» seed (COPY --from=agentdocs)
    args:
      SMT_BUILD_ID: ${SMT_BUILD_ID:-}
      SMT_BUILT_AT: ${SMT_BUILT_AT:-}
  image: smtrading-backend:local
  restart: unless-stopped
  env_file: .env
  environment:
    SMT_DATABASE_URL: postgresql+asyncpg://smtrading:${POSTGRES_PASSWORD}@postgres:5432/smtrading
    SMT_REDIS_URL: redis://redis:6379/0
  networks: [smtrading-net]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: smtrading
      POSTGRES_DB: smtrading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smtrading -d smtrading"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [smtrading-net]

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [smtrading-net]

  # One-shot: schema migrations and idempotent seed, before api/worker start.
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m smtrading.seed"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    entrypoint: ["/app/docker/entrypoint-api.sh"]
    ports:
      - "127.0.0.1:8000:8000"  # local only (spec); Paperclip uses the docker network
    volumes:
      - ./agent-instructions:/agent-instructions  # AGENTS.md per agent, read by Paperclip (External mode)

  worker:
    <<: *app
    command: ["python", "-m", "smtrading.worker.main"]

  # Automatic rules (intraday mode B), same image: prices only from the worker's price
  # publication in Redis (no data connection of its own), orders through the engine with
  # BrokerSync woken up. With no active rule it only queries the rules every 5 s.
  scalper:
    <<: *app
    command: ["python", "-m", "smtrading.autorules.main"]

  # Admin web app (nginx: SPA + proxy of /api/ and /ws to api). Ruling R12:
  # https://<pc-ip>/ for the LAN (certificate from a local CA kept in `web_certs`; port 80
  # redirects to https), plain http only on the local entry 127.0.0.1:3000.
  # API/MCP stay on 127.0.0.1.
  web:
    build:
      context: ./web
      args:
        SMT_BUILD_ID: ${SMT_BUILD_ID:-}
    image: smtrading-web:local
    restart: unless-stopped
    environment:
      SMT_PUBLIC_HOSTS: ${SMT_PUBLIC_HOSTS:-192.168.30.7}  # LAN names/IPs of this PC
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:3000:8080"
      - "8087:8087"  # «SMTrading TV» app: http, /api/tv-display only, home network only
    volumes:
      - web_certs:/etc/nginx/certs
    depends_on:
      - api
    networks: [smtrading-net]

  # Automatic backups (smtrading.backup): every night at 03:30 (SMT_TZ) a pg_dump -Fc with
  # its .sha256 and the restore bundle (agent instructions, compose file, .env.example; never
  # .env or keys) into every BACKUP_DIRS folder (`;` separated, created when missing), kept
  # 30 daily + 12 monthly; every Sunday at 04:00 a restore test into the throwaway database
  # smtrading_restore_test (dropped afterwards). State in «Salute del sistema».
  # Host folders: SMT_BACKUP_LOCAL_DIR and SMT_BACKUP_ONEDRIVE_DIR (spaces are fine).
  backup:
    <<: *app
    command: ["python", "-m", "smtrading.backup.main"]
    environment:
      SMT_DATABASE_URL: postgresql+asyncpg://smtrading:${POSTGRES_PASSWORD}@postgres:5432/smtrading
      SMT_REDIS_URL: redis://redis:6379/0
      BACKUP_DIRS: /backups/local;/backups/onedrive
    volumes:
      - type: bind
        source: ${SMT_BACKUP_LOCAL_DIR:-/mnt/d/Backups/SMTrading}
        target: /backups/local
        bind:
          create_host_path: true
      - type: bind
        source: ${SMT_BACKUP_ONEDRIVE_DIR:-/mnt/d/onedrive/OneDrive - SantoMagno/Founders - Founders/Backups/SMTrading}
        target: /backups/onedrive
        bind:
          create_host_path: true
      - ./agent-instructions:/agent-instructions:ro
      - ./docker-compose.yml:/restore-config/docker-compose.yml:ro
      - ./.env.example:/restore-config/.env.example:ro

volumes:
  pgdata:
  web_certs:

networks:
  smtrading-net:
    name: smtrading-net

name: smtrading

x-app: &app
  build: ./backend
  image: smtrading-backend:local
  restart: unless-stopped
  env_file: .env
  environment:
    SMT_DATABASE_URL: postgresql+asyncpg://smtrading:${POSTGRES_PASSWORD}@postgres:5432/smtrading
    SMT_REDIS_URL: redis://redis:6379/0
  networks: [smtrading-net]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: smtrading
      POSTGRES_DB: smtrading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smtrading -d smtrading"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [smtrading-net]

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [smtrading-net]

  # One-shot: schema migrations and idempotent seed, before api/worker start.
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m smtrading.seed"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    entrypoint: ["/app/docker/entrypoint-api.sh"]
    ports:
      - "127.0.0.1:8000:8000"  # local only (spec); Paperclip uses the docker network
    volumes:
      - backups:/backups:ro  # listed by GET /api/system/backups

  worker:
    <<: *app
    command: ["python", "-m", "smtrading.worker.main"]

  # Admin web app (nginx: SPA + proxy of /api/ and /ws to api).
  web:
    build: ./web
    image: smtrading-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"  # local only (ruling R3)
    depends_on:
      - api
    networks: [smtrading-net]

  # Daily pg_dump | gzip into the `backups` volume; keeps 14 days.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - >-
        while true; do
        pg_dump -h postgres -U smtrading smtrading | gzip > /backups/smtrading-$$(date +%F).sql.gz;
        find /backups -name "*.sql.gz" -mtime +14 -delete;
        sleep 86400;
        done
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [smtrading-net]

volumes:
  pgdata:
  backups:

networks:
  smtrading-net:
    name: smtrading-net
